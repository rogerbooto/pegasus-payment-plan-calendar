<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Checkout - Birchwood Supply Co.</title></head><body>
<main>
  <h1>Checkout</h1>
  <section aria-label="Order summary">
    <div class="row">
      <span>Order total</span>
      <span>CA$150.00</span>
    </div>
  </section>
  <section aria-label="Payment method">
    <div role="radiogroup" aria-label="Payment method">
      <label><input type="radio" name="paymentMethod" value="card" checked> Credit card</label>
      <label><input type="radio" name="paymentMethod" value="instalments"> Pay over time</label>
    </div>
    <p>4 interest-free payments of CA$37.50 every 2 weeks</p>
  </section>
  <button type="button">Place order</button>
</main>
</body></html>
